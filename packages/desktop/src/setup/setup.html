<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>CECO — Configuration</title>
<style>
  :root {
    --primary: #5E72E4;
    --primary-hover: #4C58C4;
    --violet: #825EE4;
    --ink: #0B1C30;
    --ink-variant: #43474F;
    --surface: #F8F9FF;
    --outline: #E2E5F1;
    --success: #2DCE89;
    --success-light: #E6FAF1;
    --danger: #F5365C;
    --danger-light: #FEEBEF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    overflow: hidden;
    position: relative;
    user-select: none;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    pointer-events: none;
  }
  .blob-1 { width: 220px; height: 220px; background: rgba(94,114,228,0.18); top: -60px; left: -60px; }
  .blob-2 { width: 260px; height: 260px; background: rgba(130,94,228,0.15); bottom: -80px; right: -80px; }
  .card {
    position: relative;
    z-index: 1;
    background: white;
    border-radius: 16px;
    padding: 24px 28px;
    width: 440px;
    max-height: 96vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px -10px rgba(94, 114, 228, 0.22);
    border: 1px solid var(--outline);
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .logo-img {
    width: 44px;
    height: 44px;
    object-fit: contain;
    border-radius: 10px;
  }
  h1 { font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.2; }
  p.subtitle { color: var(--ink-variant); font-size: 13px; line-height: 1.4; margin-top: 2px; }
  
  .choice { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  button.mode-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border-radius: 12px;
    border: 1.5px solid var(--outline);
    background: white;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
    transition: all 0.15s ease-in-out;
    font-family: inherit;
  }
  button.mode-btn:hover {
    border-color: var(--primary);
    box-shadow: 0 4px 14px rgba(94,114,228,0.12);
    transform: translateY(-1px);
  }
  button.mode-btn .icon-box {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--primary);
  }
  button.mode-btn strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }
  button.mode-btn span.desc { color: var(--ink-variant); font-size: 12px; line-height: 1.3; }

  .client-view { display: none; flex-direction: column; gap: 12px; }
  .client-view.visible { display: flex; }

  .discovery-panel {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .discovery-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
  }
  .scan-btn {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    padding: 2px 4px;
  }
  .scan-btn:hover { text-decoration: underline; }
  
  .server-list {
    max-height: 110px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .server-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border: 1px solid var(--outline);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .server-item:hover { border-color: var(--primary); }
  .server-name { font-weight: 600; color: var(--ink); }
  .server-ip { font-size: 11px; color: var(--ink-variant); }
  
  .connect-server-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .connect-server-btn:hover { background: var(--primary-hover); }

  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--ink-variant);
    font-size: 11px;
    margin: 2px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--outline);
  }
  .divider span { padding: 0 8px; }

  label { font-size: 12px; font-weight: 600; color: var(--ink-variant); }
  input[type="text"] {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--outline);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--primary); }
  
  .primary-btn {
    background: linear-gradient(135deg, var(--primary), var(--violet));
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 12px rgba(94,114,228,0.25);
  }
  .primary-btn:hover { opacity: 0.95; }
  
  .back-link {
    background: none;
    border: none;
    color: var(--ink-variant);
    font-size: 12px;
    cursor: pointer;
    text-align: left;
    padding: 2px 0;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .back-link:hover { color: var(--ink); }

  .status { margin-top: 10px; font-size: 12px; min-height: 16px; border-radius: 6px; }
  .status.error { color: var(--danger); background: var(--danger-light); padding: 8px 10px; }
  .status.pending { color: var(--ink-variant); display: flex; align-items: center; gap: 6px; }
  
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--outline);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="header-logo">
      <img src="../../assets/icon.png" alt="Logo CECO" class="logo-img" onerror="this.style.display='none'" />
      <div>
        <h1>Bienvenue sur CECO</h1>
        <p class="subtitle">Choisissez le mode d'exécution de cette machine.</p>
      </div>
    </div>

    <!-- Vue principale de sélection -->
    <div class="choice" id="choiceView">
      <button class="mode-btn" id="btnServeur">
        <div class="icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 1h16c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V3c0-1.1.9-2 2-2zm0 8h16c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2zm0 8h16c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-4c0-1.1.9-2 2-2zM6 5h2v2H6V5zm0 8h2v2H6v-2zm0 8h2v2H6v-2z"/></svg>
        </div>
        <div>
          <strong>Mode Serveur</strong>
          <span class="desc">Héberge la base de données locale et les services du centre.</span>
        </div>
      </button>

      <button class="mode-btn" id="btnClient">
        <div class="icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 3.5c3.55 0 6.81 1.34 9.3 3.56L12 18.25 2.7 11.06A14.28 14.28 0 0 1 12 7.5z"/></svg>
        </div>
        <div>
          <strong>Mode Client</strong>
          <span class="desc">Se connecte à un serveur CECO actif sur le réseau local.</span>
        </div>
      </button>
    </div>

    <!-- Vue de configuration client avec découverte réseau -->
    <div class="client-view" id="clientView">
      <div class="discovery-panel">
        <div class="discovery-header">
          <span>Serveurs détectés sur le réseau</span>
          <button class="scan-btn" id="btnRescan">Actualiser</button>
        </div>
        <div class="server-list" id="serverList">
          <div style="font-size: 11px; color: var(--ink-variant); text-align: center; padding: 12px 0;" id="discoveryStatus">
            Recherche en cours...
          </div>
        </div>
      </div>

      <div class="divider"><span>ou saisie manuelle</span></div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="serverAddress">Adresse IP et port du serveur</label>
        <input type="text" id="serverAddress" placeholder="Ex: 192.168.1.50:4000" />
      </div>

      <button class="primary-btn" id="btnConnectManual">Se connecter</button>
      <button class="back-link" id="btnBack">← Revenir au choix de mode</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    const choiceView = document.getElementById("choiceView");
    const clientView = document.getElementById("clientView");
    const statusEl = document.getElementById("status");
    const serverListEl = document.getElementById("serverList");
    const serverAddressInput = document.getElementById("serverAddress");

    function setStatus(text, kind) {
      statusEl.className = "status" + (kind ? " " + kind : "");
      if (kind === "pending") {
        statusEl.innerHTML = '<span class="spinner"></span> ' + text;
      } else {
        statusEl.textContent = text || "";
      }
    }

    document.getElementById("btnServeur").addEventListener("click", async () => {
      setStatus("Démarrage de PostgreSQL et des services...", "pending");
      const result = await window.cecoSetup.chooseServer();
      if (!result.ok) setStatus(result.error, "error");
    });

    document.getElementById("btnClient").addEventListener("click", () => {
      choiceView.style.display = "none";
      clientView.classList.add("visible");
      setStatus("");
      startDiscovery();
    });

    document.getElementById("btnBack").addEventListener("click", () => {
      choiceView.style.display = "flex";
      clientView.classList.remove("visible");
      setStatus("");
    });

    async function startDiscovery() {
      serverListEl.innerHTML = '<div style="font-size: 11px; color: var(--ink-variant); text-align: center; padding: 12px 0;"><span class="spinner"></span> Scan du réseau local...</div>';
      try {
        const servers = await window.cecoSetup.discoverServers();
        if (!servers || servers.length === 0) {
          serverListEl.innerHTML = '<div style="font-size: 11px; color: var(--ink-variant); text-align: center; padding: 10px 0;">Aucun serveur CECO détecté automatiquement.</div>';
          return;
        }

        serverListEl.innerHTML = "";
        servers.forEach((srv) => {
          const item = document.createElement("div");
          item.className = "server-item";
          item.innerHTML = `
            <div>
              <div class="server-name">${srv.name || "Serveur CECO"}</div>
              <div class="server-ip">${srv.address}</div>
            </div>
            <button class="connect-server-btn" data-address="${srv.address}">Choisir</button>
          `;
          serverListEl.appendChild(item);
        });

        document.querySelectorAll(".connect-server-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const addr = e.target.getAttribute("data-address");
            connectToAddress(addr);
          });
        });
      } catch (err) {
        serverListEl.innerHTML = '<div style="font-size: 11px; color: var(--danger); text-align: center; padding: 8px 0;">Échec de la détection réseau.</div>';
      }
    }

    document.getElementById("btnRescan").addEventListener("click", startDiscovery);

    async function connectToAddress(address) {
      if (!address) return setStatus("Veuillez saisir une adresse valide.", "error");
      setStatus("Connexion au serveur en cours...", "pending");
      const result = await window.cecoSetup.chooseClient(address);
      if (!result.ok) setStatus(result.error, "error");
    }

    document.getElementById("btnConnectManual").addEventListener("click", () => {
      const address = serverAddressInput.value.trim();
      connectToAddress(address);
    });
  </script>
</body>
</html>
