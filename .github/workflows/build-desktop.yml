name: Build CECO Desktop (Test)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm --filter @ceco/backend prisma:generate

      - name: Construire l'installateur pour ${{ matrix.os }}
        env:
          USE_HARD_LINKS: "false"
        run: pnpm --filter @ceco/desktop run build:installer

      - name: Publier dans les Releases (Gratuit)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v-test"
          name: "Test de build - Installer"
          draft: true
          files: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.snap
            packages/desktop/dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}